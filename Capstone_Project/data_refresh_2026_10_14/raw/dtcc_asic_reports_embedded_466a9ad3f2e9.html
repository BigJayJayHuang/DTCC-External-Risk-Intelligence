			 function getLatestReportDate(){
			 	var today=new Date();
			 	var day=today.getDay();
																					
				var diff=today.getDate()-day+(day >= 5 ? 5:-2);
			 	var displayDate=new Date(today.setDate(diff));
			
			 		var dd=displayDate.getDate();
			 		var mm=displayDate.getMonth()+1;
			 		var yyyy=displayDate.getFullYear();
			 		if(dd<10){
			 	    	dd='0'+dd;
			 		} 
			 		if(mm<10){
			 	    	mm='0'+mm;
			 		} 
			 	var fdisplayDate = yyyy+''+mm+''+dd;
			 	dtcc_app.availableReportDates.unshift(fdisplayDate);
			}

			var twoDigitMonth = today.getMonth()+1;if(twoDigitMonth.length==1){	twoDigitMonth="0" +twoDigitMonth;}

			console.log("before myobject length"+select.length);

			} 
			console.log("currentYear after :"+currentYear);
			for(var i=last;i<=currentYear;i++){

				console.log("nextval:"+nextval);
				newyr=i +'-'+nextval;
				select.options[select.options.length] = new Option(newyr);
			}
			console.log("after myobject length"+select.length);
				/* for(index in myobject) {

				} */
		}

 				}else{

		function generateHtmlTable(data){
				var cell_data=[];
				data=data.replace(/,(?=,)/g, '," "');
				var report_data=data.split(/\r?\n|\r/);
				var table_data = '<table id="report_table" class="table table-condensed table-hover table-striped">';
				for(var count = 0; count<report_data.length; count++)
			    {
					var cell_data = report_data[count].match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
					/* cell_data = $.map(cell_data, function(value){
						  return value.replace(/ /g, '');
						}); */
				     table_data += '<tr>';
				     if(cell_data != null){
				     for(var cell_count=0; cell_count<cell_data.length; cell_count++)
				     {
				     //console.log("cell_data[cell_count]:::"+cell_data[cell_count]);
				    	 if(count === 0)
				         {
				          table_data += '<th nowrap colspan="1">'+cell_data[cell_count]+'</th>';
				         }
				         else
				         {
				          table_data += '<td nowrap>'+cell_data[cell_count].replace(/"/g, "")+'</td>';
				  }
				     }
				     }
				     table_data += '</tr>';
			    }
				table_data += '</table>';
				return table_data;
			}
