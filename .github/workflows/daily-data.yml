name: Daily public-data update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-data.yml'
      - 'Capstone_Project/**'
  schedule:
    # 22:17 UTC = 18:17 New York during daylight time, 17:17 in winter.
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-public-database
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Capstone_Project/capstone_database
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Capstone_Project/capstone_database/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Restore latest durable database
        run: python github_release.py restore
      - name: Collect and preserve incremental revisions
        run: python update.py
      - name: Validate source evidence and database
        run: python validate.py
      - name: Publish the shared snapshot and CSV exports
        run: python github_release.py publish
      - name: Keep a recovery copy for this run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capstone-public-data-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            Capstone_Project/capstone_database/data/capstone.sqlite3.gz
            Capstone_Project/capstone_database/data/snapshot_manifest.json
            Capstone_Project/capstone_database/exports/
            Capstone_Project/capstone_database/logs/
      - name: Report partial collection failures
        run: |
          python - <<'PY'
          import json
          report=json.load(open('logs/latest_update.json'))
          if report['failed_sources']:
              for source in report['failed_sources']:
                  print('::error title=Public source update failed::'+source['source_id'])
              raise SystemExit('Snapshot published with partial source failures. Previous valid values retained; inspect latest_update.json.')
          PY
