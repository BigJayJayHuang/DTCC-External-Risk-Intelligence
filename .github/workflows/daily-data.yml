name: Daily public-data update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-data.yml'
      - 'Capstone_Project/**'
  schedule:
    # 22:17 UTC = 18:17 New York during daylight time, 17:17 in winter.
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-public-database
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Capstone_Project/capstone_database
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Capstone_Project/capstone_database/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Restore latest durable database
        run: python github_release.py restore
      - name: Integrate committed reviewed research inputs
        run: python github_release.py import-reviewed
      - name: Collect and preserve incremental revisions
        run: python update.py
      - name: Validate source evidence and database
        run: python validate.py
      - name: Publish the shared snapshot and CSV exports
        run: python github_release.py publish
      - name: Keep a recovery copy for this run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capstone-public-data-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            Capstone_Project/capstone_database/data/capstone.sqlite3.gz
            Capstone_Project/capstone_database/data/snapshot_manifest.json
            Capstone_Project/capstone_database/exports/
            Capstone_Project/capstone_database/logs/
      - name: Report partial collection failures
        run: |
          python - <<'PY'
          import json
          report=json.load(open('logs/latest_update.json'))
          if report['failed_sources']:
              for source in report['failed_sources']:
                  print('::error title=Public source update failed::'+source['source_id'])
              raise SystemExit('Snapshot published with partial source failures. Previous valid values retained; inspect latest_update.json.')
          PY

  bedrock:
    name: Bedrock review candidates
    needs: update
    # DTCC supplies the OIDC role and confirms the recurring cap before enablement.
    if: ${{ needs.update.result == 'success' && github.ref == 'refs/heads/main' && vars.BEDROCK_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: Capstone_Project
    env:
      GH_TOKEN: ${{ github.token }}
      BEDROCK_AUTH_MODE: workload
      BEDROCK_ROLE_ARN: ${{ vars.BEDROCK_ROLE_ARN }}
      CLASSIFIER_RUN_ID: daily-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r validation/requirements-llm.txt
      - name: Check the configured DTCC role
        run: |
          python - <<'PY'
          import json, os, re
          config=json.load(open('validation/llm_classifier_config.json'))
          expected='arn:aws:iam::'+config['expected_account_id']+':role/'
          role=os.environ.get('BEDROCK_ROLE_ARN','')
          if not role.startswith(expected) or not re.fullmatch(r'arn:aws:iam::\d{12}:role/[\w+=,.@/-]+',role):
              raise SystemExit('Set BEDROCK_ROLE_ARN to the DTCC-approved OIDC role before enabling Bedrock.')
          PY
      - name: Use this pipeline run's news export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: capstone-public-data-${{ github.run_id }}
          path: Capstone_Project/capstone_database
      - name: Restore durable classifier state
        run: python -m validation.llm_daily_release restore
      - name: Select unseen requests and reserve the daily budget
        id: prepare
        run: python -m validation.llm_daily prepare --run-id "$CLASSIFIER_RUN_ID" --budget 10 --max-articles 100
      - name: Publish reservation before any paid call
        id: checkpoint
        run: python -m validation.llm_daily_release checkpoint
      - name: Obtain temporary AWS role credentials
        if: steps.prepare.outputs.invoke == 'true'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.BEDROCK_ROLE_ARN }}
          aws-region: us-east-2
          allowed-account-ids: '888840134592'
          role-session-name: capstone-bedrock-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          mask-aws-account-id: true
      - name: Classify news and reconcile actual usage
        if: steps.prepare.outputs.invoke == 'true'
        run: python -m validation.llm_daily execute --plan "data/events/daily_runtime/$CLASSIFIER_RUN_ID/plan.json"
      - name: Publish candidates, raw outputs and durable state
        if: always() && steps.checkpoint.outcome == 'success'
        run: python -m validation.llm_daily_release publish --run-dir "data/events/daily_runtime/$CLASSIFIER_RUN_ID"
      - name: Keep classifier recovery evidence
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bedrock-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: Capstone_Project/data/events/daily_runtime/
