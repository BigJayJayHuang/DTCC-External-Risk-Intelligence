name: LLM classifier offline checks

on:
  pull_request:
    paths:
      - 'Capstone_Project/validation/llm_classifier*'
      - 'Capstone_Project/validation/test_llm_classifier.py'
      - 'Capstone_Project/validation/event_scoring.py'
      - 'Capstone_Project/validation/llm_event_classifier_prompt.md'
      - 'Capstone_Project/validation/requirements-llm.txt'
      - '.github/workflows/llm-classifier.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Capstone_Project
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r validation/requirements-llm.txt
      - run: python -m unittest validation.test_llm_classifier -v
      - run: python -m validation.test_event_scoring
      - name: Confirm protected files remain unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --exit-code "$BASE_SHA" HEAD -- validation/llm_event_classifier_prompt.md data/events/event_register.csv
