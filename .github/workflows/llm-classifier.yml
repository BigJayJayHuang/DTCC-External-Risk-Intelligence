name: LLM classifier offline checks

on:
  pull_request:
    paths:
      - 'Capstone_Project/validation/llm_classifier*'
      - 'Capstone_Project/validation/test_llm_classifier.py'
      - 'Capstone_Project/validation/llm_daily*'
      - 'Capstone_Project/validation/test_llm_daily.py'
      - 'Capstone_Project/validation/event_scoring.py'
      - 'Capstone_Project/validation/llm_event_classifier_prompt.md'
      - 'Capstone_Project/validation/llm_event_classifier_prompt_v*.md'
      - 'Capstone_Project/validation/requirements-llm.txt'
      - 'Capstone_Project/validation/requirements-review.txt'
      - 'Capstone_Project/validation/test_llm_*.py'
      - 'Capstone_Project/validation/google_news*'
      - 'Capstone_Project/validation/news_queries.csv'
      - 'Capstone_Project/validation/test_google_news.py'
      - 'Capstone_Project/validation/publisher_feeds*'
      - 'Capstone_Project/validation/test_publisher_feeds.py'
      - 'Capstone_Project/validation/review_sheet.py'
      - 'Capstone_Project/validation/promote_reviewed.py'
      - 'Capstone_Project/validation/test_review_promote.py'
      - 'Capstone_Project/validation/weekly_news_run.py'
      - 'Capstone_Project/validation/test_weekly_news_run.py'
      - 'Capstone_Project/validation/test_news_evidence_scope.py'
      - 'Capstone_Project/validation/refresh_scoring_inputs.py'
      - 'Capstone_Project/validation/test_market_refresh.py'
      - 'Capstone_Project/validation/data.py'
      - 'Capstone_Project/validation/golden_eval.py'
      - 'Capstone_Project/validation/llm_strict_diagnostic.py'
      - 'Capstone_Project/validation/scoring_v1_3.py'
      - 'Capstone_Project/validation/fixtures/**'
      - 'Capstone_Project/validation/check_register_change.py'
      - 'Capstone_Project/validation/alpha_vantage_news.py'
      - 'Capstone_Project/validation/test_alpha_vantage_news.py'
      - 'Capstone_Project/validation/test_check_register_change.py'
      - 'Capstone_Project/data/events/event_register.csv'
      - 'Capstone_Project/data/events/register_changelog.csv'
      - '.github/workflows/llm-classifier.yml'
      - '.github/workflows/daily-data.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Capstone_Project
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r validation/requirements-llm.txt -r validation/requirements-review.txt
      - run: python -m unittest validation.test_llm_classifier -v
      - run: python -m unittest validation.test_llm_daily -v
      - run: python -m validation.test_event_scoring
      - name: Prompt versions, flat schema, Google News, publisher feeds, review, promotion, weekly run
        run: >-
          python -m unittest -v validation.test_llm_prompt_v13 validation.test_llm_flat_schema
          validation.test_google_news validation.test_publisher_feeds validation.test_review_promote
          validation.test_weekly_news_run
          validation.test_news_evidence_scope validation.test_market_refresh validation.test_check_register_change validation.test_alpha_vantage_news
      - name: Confirm protected files remain unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --exit-code "$BASE_SHA" HEAD -- validation/llm_event_classifier_prompt.md
      - name: Check event register changes (two new empty columns, provenance on added rows, logged removals)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -m validation.check_register_change --base "$BASE_SHA"
